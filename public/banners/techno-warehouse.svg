<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="laser" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glow)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Laser Beams -->
  <line x1="100" y1="675" x2="800" y2="0" stroke="url(#laser)" stroke-width="3" />
  <line x1="250" y1="675" x2="950" y2="0" stroke="url(#laser)" stroke-width="2" />
  <line x1="400" y1="675" x2="1100" y2="0" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2" />

  <!-- Equalizer / Sound Wave Graphic -->
  <g transform="translate(150, 480)" fill="#06b6d4" opacity="0.85">
    <rect x="0" y="-80" width="12" height="80" rx="4" />
    <rect x="24" y="-140" width="12" height="140" rx="4" fill="#38bdf8" />
    <rect x="48" y="-110" width="12" height="110" rx="4" />
    <rect x="72" y="-190" width="12" height="190" rx="4" fill="#ec4899" />
    <rect x="96" y="-130" width="12" height="130" rx="4" />
    <rect x="120" y="-220" width="12" height="220" rx="4" fill="#ec4899" />
    <rect x="144" y="-160" width="12" height="160" rx="4" fill="#38bdf8" />
    <rect x="168" y="-100" width="12" height="100" rx="4" />
    <rect x="192" y="-150" width="12" height="150" rx="4" fill="#ec4899" />
    <rect x="216" y="-80" width="12" height="80" rx="4" />
  </g>

  <!-- Live Concert Typography -->
  <g transform="translate(100, 220)">
    <rect x="0" y="-45" width="220" height="34" rx="8" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.5" />
    <text x="110" y="-23" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f43f5e" letter-spacing="3" text-anchor="middle">LIVE CONCERT</text>
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">SUB-ZERO 004</text>
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">The Community Hall • Contemporary Live Sound &amp; Visuals</text>
  </g>
</svg>
