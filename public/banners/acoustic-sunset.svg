      <stop offset="0%" stop-color="#431407" />
      <stop offset="40%" stop-color="#7c2d12" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="sun" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sunsetBg)" />
  <rect width="1200" height="675" fill="url(#sun)" />

  <!-- Sun Graphic -->
  <circle cx="850" cy="240" r="130" fill="#fbbf24" opacity="0.6" filter="blur(8px)" />
  <circle cx="850" cy="240" r="100" fill="#fef08a" opacity="0.8" />

  <!-- Skyline Silhouette -->
  <path d="M0,675 L0,520 L60,520 L60,480 L140,480 L140,540 L220,540 L220,440 L290,440 L290,560 L380,560 L380,470 L480,470 L480,550 L560,550 L560,490 L670,490 L670,530 L780,530 L780,450 L890,450 L890,540 L1000,540 L1000,480 L1110,480 L1110,530 L1200,530 L1200,675 Z" fill="#1c1917" opacity="0.85" />

  <!-- Typography -->
  <g transform="translate(100, 220)">
