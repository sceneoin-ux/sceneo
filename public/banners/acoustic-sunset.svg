    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">Sunset Unplugged</text>
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#fed7aa">Skyline Terrace Lounge • Indie &amp; Chai Session (Jubilee Hills)</text>
