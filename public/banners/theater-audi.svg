<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="theaterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2d" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <radialGradient id="projector" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#3b0764" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090514" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#theaterBg)" />
  <rect width="1200" height="675" fill="url(#projector)" />

  <!-- Cinema Projector Light Cone -->
  <polygon points="600,0 200,675 1000,675" fill="#a855f7" opacity="0.12" />

  <!-- Cinema Screen Contour -->
  <rect x="250" y="80" width="700" height="380" rx="16" fill="#1e1138" stroke="#7e22ce" stroke-width="2" opacity="0.6" />
  
  <!-- Movie Film Reel Graphic -->
  <g transform="translate(100, 220)">
    <rect x="0" y="-45" width="220" height="34" rx="8" fill="#9333ea" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5" />
    <text x="110" y="-23" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#c084fc" letter-spacing="3" text-anchor="middle">THEATER SCREENING</text>
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">Studio Classics (Audi 3)</text>
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#d8b4fe">Prasad's Multiplex • Big Screen &amp; DTS 7.1 Surround Sound</text>
  </g>
</svg>
